name: Posture reminders

on:
  schedule:
    # 03:30–15:30 UTC every 2 h = 9 AM, 11, 1 PM, 3, 5, 7, 9 PM IST
    - cron: '30 3-15/2 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Force an IST hour (9, 11, 13, 15, 17, 19, 21) to test'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/send.mjs
        env:
          FORCE_SLOT: ${{ github.event.inputs.slot }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io
