name: Posture reminders

on:
  schedule:
    # Every 15 min from 08:37 to 22:22 IST. GitHub often delays or skips scheduled runs,
    # so we check often and send each slot (9, 11, 13 ... 21 IST) only once.
    - cron: '7,22,37,52 3-16 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Force an IST hour (9, 11, 13, 15, 17, 19, 21) to test'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Work out which slot is due
        id: slot
        if: github.event_name == 'schedule'
        run: node scripts/send.mjs --check

      - name: Already sent?
        id: sent
        if: steps.slot.outputs.key
        uses: actions/cache/restore@v4
        with:
          path: .sent
          key: ${{ steps.slot.outputs.key }}
          lookup-only: true

      - name: Send reminder
        if: github.event_name == 'workflow_dispatch' || (steps.slot.outputs.key && steps.sent.outputs.cache-hit != 'true')
        run: npm install --no-audit --no-fund && node scripts/send.mjs
        env:
          FORCE_SLOT: ${{ github.event.inputs.slot }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io

      - name: Mark slot as sent
        if: steps.slot.outputs.key && steps.sent.outputs.cache-hit != 'true'
        run: touch .sent
      - if: steps.slot.outputs.key && steps.sent.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sent
          key: ${{ steps.slot.outputs.key }}
